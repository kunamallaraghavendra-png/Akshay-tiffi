
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#138b50">
  <title>Akshay Tiffin Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="logo">A</div>
    <h1>Akshay Tiffin Center</h1>
    <p>Fresh Tiffins • Tasty Food</p>
    <a class="main-btn" href="#menu">View Menu</a>
  </header>

  <main>
    <section id="menu">
      <h2>Our Menu</h2>
      <p class="subtitle">Choose your favourite tiffin</p>
      <div id="menu-items" class="menu-grid"></div>
    </section>

    <section class="order-info">
      <h2>Want to Order?</h2>
      <p>Select an item and order directly through WhatsApp.</p>
      <button class="main-btn" onclick="orderGeneral()">
        Order on WhatsApp
      </button>
    </section>
  </main>

  <footer>
    <p>Akshay Tiffin Center</p>
    <p>Thank you for visiting!</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
